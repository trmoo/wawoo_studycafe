<script>
/*!
 * 좌석 배치 — 1·2학년 자습실 (114석)
 * © 2026 티쳐무 · 모든 권리 보유
 *
 * 3학년 자습실 좌석배치도와 같은 묶음 · 같은 구역 색이다. 다만 원래 화면은 맨 윗줄과 양옆 줄이 낮아
 * 번호 · 이름 · 학번이 겹쳐 보였으므로, 모든 좌석이 거의 같은 크기(가로 51~58 · 세로 52~60)가 되게 다시 놓았다.
 *   · 양옆 줄은 가운데 여섯 줄보다 길게, 교사 책상 옆까지 내려온다.
 *
 * 자리 번호 (2026-11-16 선생님이 그려 준 차례 — 3학년 번호와 다르다)
 *   · 맨 위 한 줄          1 ~ 12   왼쪽 → 오른쪽
 *   · 왼쪽 세로 줄         13 ~ 21  위 → 아래
 *   · 가운데 묶음 다섯 개  22 ~ 81  왼쪽 묶음부터. 한 묶음 안에서는 왼쪽 줄 위 → 아래, 이어서 오른쪽 줄 위 → 아래
 *                           (22~33 · 34~45 · 46~57 · 58~69 · 70~81)
 *   · 오른쪽 세로 줄       82 ~ 90  위 → 아래
 *   · 아래쪽 초록          91 ~ 114 (예전 그대로)
 * 단위는 그림의 점(가로 820 · 세로 806). 화면에서는 % 로 바꾸어 그리므로 창 크기에 맞춰 늘고 준다.
 * ⚠ DOM 을 만들지 말 것 — 시험(node)이 이 파일을 그대로 불러다 좌석 114개를 검사한다.
 */
var LAYOUT = (function () {
  var CW = 58, CH = 60, G = 4, BG = 14;          // 좌석 가로 · 세로 · 묶음 안 틈 · 묶음 사이 틈
  var SIDE_L = 10;
  var BX = [82, 216, 350, 484, 618];              // 가운데 묶음 다섯 개의 왼쪽 끝 (묶음 너비 = 58 + 4 + 58 = 120)
  var SIDE_R = 752;
  var W = 820, H = 806;
  var TOP_Y = 10, TOP_H = 52;
  var MAIN_Y = TOP_Y + TOP_H + BG;                // 76
  var LOW_Y = MAIN_Y + 6 * CH + 5 * G + BG;       // 470 — 교사 책상 옆 두 줄
  var BOT_Y = LOW_Y + 2 * CH + G + BG;            // 608 — 맨 아래 세 줄
  var seats = [];
  function seat(no, x, y, w, h, zone) { seats.push({ no: no, x: x, y: y, w: w, h: h, zone: zone }); }

  /* 맨 위 한 줄 1~12 (파랑) — 가운데 묶음 다섯 개 너비(82~738)에 고르게, 왼쪽부터 */
  var topW = (BX[4] + 120 - BX[0] - 11 * G) / 12;  // 51
  for (var i = 0; i < 12; i++) seat(1 + i, BX[0] + i * (topW + G), TOP_Y, topW, TOP_H, 'blue');

  /* 양옆 세로 줄 (노랑) — 왼쪽 13~21 · 오른쪽 82~90, 위에서 아래로.
     가운데 여섯 줄 + 책상 옆 두 줄 높이에 아홉 자리 */
  var sideH = (LOW_Y + 2 * CH + G - MAIN_Y - 8 * G) / 9;   // 54
  for (var j = 0; j < 9; j++) {
    seat(13 + j, SIDE_L, MAIN_Y + j * (sideH + G), CW, sideH, 'yellow');
    seat(82 + j, SIDE_R, MAIN_Y + j * (sideH + G), CW, sideH, 'yellow');
  }

  /* 가운데 두 줄짜리 묶음 다섯 개 — 묶음마다 12자리, 22번부터.
     한 묶음 안에서 왼쪽 줄을 위→아래로 6자리, 이어서 오른쪽 줄을 위→아래로 6자리 */
  var ZONES = ['orange', 'pink', 'pink', 'pink', 'orange'];
  ZONES.forEach(function (zone, k) {
    var first = 22 + k * 12;
    for (var r = 0; r < 6; r++) {
      seat(first + r, BX[k], MAIN_Y + r * (CH + G), CW, CH, zone);
      seat(first + 6 + r, BX[k] + CW + G, MAIN_Y + r * (CH + G), CW, CH, zone);
    }
  });

  /* 아래쪽 (초록) — 교사 책상 옆 2×2, 그 옆 한 줄, 맨 아래 세 묶음 */
  seat(109, BX[1], LOW_Y, CW, CH, 'green');          seat(112, BX[1] + CW + G, LOW_Y, CW, CH, 'green');
  seat(110, BX[1], LOW_Y + CH + G, CW, CH, 'green'); seat(111, BX[1] + CW + G, LOW_Y + CH + G, CW, CH, 'green');
  seat(113, BX[2], LOW_Y, CW, CH, 'green');          seat(114, BX[2], LOW_Y + CH + G, CW, CH, 'green');
  var BOTTOM = [
    { k: 0, left: [91, 92, 93], right: [96, 95, 94] },
    { k: 1, left: [97, 98, 99], right: [102, 101, 100] },
    { k: 2, left: [103, 104, 105], right: [108, 107, 106] }
  ];
  BOTTOM.forEach(function (b) {
    for (var r = 0; r < 3; r++) {
      seat(b.left[r], BX[b.k], BOT_Y + r * (CH + G), CW, CH, 'green');
      seat(b.right[r], BX[b.k] + CW + G, BOT_Y + r * (CH + G), CW, CH, 'green');
    }
  });

  var fixtures = [
    { kind: 'desk', label: '교사\n(자습감독)', x: BX[0], y: LOW_Y, w: 2 * CW + G, h: 2 * CH + G },
    { kind: 'door', label: '출입문', x: BX[3] + 16, y: LOW_Y, w: 28, h: CH },
    { kind: 'door', label: '출입문', x: BX[3] + 16, y: LOW_Y + CH + G, w: 28, h: CH }
  ];

  seats.sort(function (a, b) { return a.no - b.no; });
  return { W: W, H: H, seats: seats, fixtures: fixtures };
})();
</script>
