<script>
/*!
 * 교사 화면 — 🪑 야자감독 · 📋 출석부 · 🧑‍🏫 담임교사 · 📌 지정석
 * © 2026 티쳐무 · 모든 권리 보유
 */
/* 출결은 셋뿐 — 출석 · 결석 · 사유 (지각 · 조퇴 · 자리비움 같은 일은 「사유」 + 메모로 적는다) */
var STATUS_KEY = { '출석': 'present', '결석': 'absent', '사유': 'excused' };
var STATUS_MARK = { '출석': '○', '결석': '✕', '사유': '사' };
var MODES = [
  { key: 'detail', label: '📝 자세히' },
  { key: '출석', label: '✔ 출석', cls: 'm-present' },
  { key: '결석', label: '결석', cls: 'm-absent' },
  { key: '사유', label: '사유', cls: 'm-excused' }
];
var MEMO_CHIPS = ['출석 표시했으나 자리에 없음', '병원(사전 연락)', '학교 행사', '보호자 연락 후 조기 귀가', '자리 옮김'];

var T = {
  /* 체험판 · 미리보기는 새로 고칠 때마다 가짜 시트가 새로 깔리므로 지난 접속표를 쓰지 않는다 */
  token: BOOT_DATA.preview ? null : store('sc12-t'), name: store('sc12-tn') || '', tab: store('sc12-tab') || 'sup',
  date: '', period: 1, mode: 'detail', board: null, ver: '', roster: null, poll: null, search: '',
  rollGrade: Number(store('sc12-rg') || 1), rollDate: '', cls: store('sc12-cls') || '1-1',
  /* 담임교사 탭에서 고쳤지만 아직 저장하지 않은 줄 — { 열쇠: { n, name, d, label } } */
  drafts: {}
};

/* ── 로그인 ── */
function tGate(msg) {
  $('app').classList.add('hidden');
  $('who').classList.add('hidden');
  var gate = $('gate');
  gate.classList.remove('hidden');
  var nm = h('input', { type: 'text', maxlength: '6', autocomplete: 'off', placeholder: '예: 김선생' });
  var pw = h('input', { type: 'password', maxlength: '30', autocomplete: 'current-password' });
  var box = h('div');
  var btn = h('button', { class: 'btn primary', type: 'submit', style: 'width:100%;margin-top:6px' }, '들어가기');
  fill(gate, h('form', {
    onsubmit: function (e) {
      e.preventDefault();
      var n = nm.value.trim();
      if (!/^[가-힣]{2,6}$/.test(n)) { fill(box, h('div', { class: 'msg' }, '이름은 한글 2~6자로 적어 주세요.')); return; }
      if (!pw.value) { fill(box, h('div', { class: 'msg' }, '교사용 비밀번호를 넣어 주세요.')); return; }
      btn.disabled = true;
      call('apiTLogin', [n, pw.value]).then(function (r) {
        btn.disabled = false;
        if (!r.ok) { fill(box, h('div', { class: 'msg' }, r.msg)); return; }
        T.token = r.token; T.name = r.name;
        store('sc12-t', r.token); store('sc12-tn', r.name);
        T.date = r.today;
        start();
      });
    }
  },
    h('h2', null, '🧑‍🏫 교사 로그인'),
    h('p', { class: 'note' }, '이름은 출결을 기록할 때 「감독 교사」 로 남습니다.'),
    h('label', { class: 'field' }, h('span', null, '이름'), nm),
    h('label', { class: 'field' }, h('span', null, '교사용 비밀번호'), pw),
    btn, box));
  if (msg) fill(box, h('div', { class: 'msg info' }, msg));
  nm.focus();
}

function tLogout(msg) {
  if (T.poll) { T.poll.stop(); T.poll = null; }
  if (T.token) call('apiLogout', [T.token], { quiet: true });
  closeModal(); PIN_DRAW = null;
  T.token = null; T.board = null; T.roster = null; T.ver = ''; T.drafts = {};
  store('sc12-t', null); store('sc12-tn', null);
  tGate(msg);
}

/** 서버가 「다시 들어오세요」 라고 하면 로그인 화면으로 */
function tCall(fn, args, opts) {
  return call(fn, [T.token].concat(args || []), opts).then(function (r) {
    if (!r.ok && r.relogin) { tLogout('접속이 끝났습니다. 다시 들어와 주세요.'); return { ok: false, msg: '' }; }
    return r;
  });
}

function start() {
  $('gate').classList.add('hidden');
  $('app').classList.remove('hidden');
  var who = $('who');
  who.classList.remove('hidden');
  fill(who, [
    h('span', { class: 'who-name' }, T.name + ' 선생님'),
    h('button', { class: 'btn small pinbtn', type: 'button', onclick: openPinReset }, '🔑 학생 PIN 초기화'),
    h('button', { class: 'btn small', type: 'button', onclick: function () { confirmLeave(function () { tLogout(); }); } }, '나가기')]);
  if (!T.date) T.date = todayLocal();
  loadRoster();
  showTab(T.tab);
}

function todayLocal() {
  var d = new Date();
  var mm = d.getMonth() + 1, dd = d.getDate();
  return d.getFullYear() + '-' + (mm < 10 ? '0' : '') + mm + '-' + (dd < 10 ? '0' : '') + dd;
}

function loadRoster() {
  return tCall('apiTRoster', [], { quiet: true }).then(function (r) {
    if (r.ok) {
      T.roster = r.list;
      if (T.tab === 'class') renderClass();
      if (T.tab === 'sup') renderFind();
      if (T.tab === 'fixed') renderFixed();
      if (PIN_DRAW) PIN_DRAW();
      if (FX_DRAW) FX_DRAW();
    }
  });
}

/* ── 탭 ── */
var TABS = [
  { key: 'sup', label: '🪑 야자감독' },
  { key: 'roll', label: '📋 출석부' },
  { key: 'class', label: '🧑‍🏫 담임교사' },
  { key: 'fixed', label: '📌 지정석' }
];
function showTab(key) {
  /* 담임교사 탭에서 저장하지 않은 줄이 있으면 먼저 묻는다 */
  if (T.tab === 'class' && key !== 'class' && classDirty().length) { confirmLeave(function () { showTab(key); }); return; }
  T.tab = key; store('sc12-tab', key);
  fill($('tabs'), TABS.map(function (t) {
    return h('button', { class: 'tab' + (t.key === key ? ' on' : ''), type: 'button', onclick: function () { showTab(t.key); } }, t.label);
  }));
  if (T.poll) { T.poll.stop(); T.poll = null; }
  closeModal();
  if (key === 'sup') { buildSup(); T.ver = ''; loadBoard(false); T.poll = poller(function () { return loadBoard(true); }, 10000); }
  if (key === 'roll') buildRoll();
  if (key === 'class') buildClass();
  if (key === 'fixed') buildFixed();
}

/* ═════════ 🪑 야자감독 ═════════ */
function buildSup() {
  var search = h('input', { type: 'text', id: 'q', maxlength: '10', placeholder: '🔎 이름 또는 학번 찾기', value: T.search, autocomplete: 'off',
    oninput: function () { T.search = search.value.trim(); renderMap(); renderFind(); } });
  var date = h('input', { type: 'date', value: T.date,
    onchange: function () { if (date.value) { T.date = date.value; T.ver = ''; T.board = null; loadBoard(false); } } });
  fill($('pane'), [
    h('div', { class: 'pillrow' },
      h('span', { class: 'pill' }, '배정 ', h('b', { id: 'cTaken' }, '0'), ' 석 · 빈자리 ', h('b', { id: 'cFree' }, '0'), ' 석'),
      h('span', { class: 'pill' }, '갱신 ', h('span', { id: 'updated' }, '-')),
      /* 시트 메뉴로 시간 제한을 잠시 풀었을 때만 보인다 */
      h('span', { class: 'pill warn hidden', id: 'freePill' }),
      /* 찾기 칸은 줄 맨 끝 — 휴대폰에서 줄이 접혀도 결과 상자가 바로 밑에 온다 */
      h('span', { class: 'pill search' }, search)),
    /* 찾기 결과 — 검색창 바로 밑 (찾는 글이 있을 때만 보인다) */
    h('div', { class: 'findpanel noprint hidden', id: 'findList' }),
    h('div', { class: 'card noprint' },
      h('div', { class: 'toolbar' },
        date,
        h('span', { class: 'seg', id: 'periods' }),
        h('span', { class: 'seg', id: 'modes' }),
        h('span', { class: 'counts', id: 'counts' })),
      h('div', { class: 'toolbar' }, h('div', { class: 'hint', id: 'hint' }))),
    h('div', { class: 'card' },
      h('div', { class: 'mapbox', id: 'mapbox' }),
      h('div', { class: 'legend' },
        h('span', null, h('i', { class: 'l1' }), '1학년'),
        h('span', null, h('i', { class: 'l2' }), '2학년'),
        h('span', null, '줄무늬 = 결석 · 사유'),
        h('span', null, h('i', { class: 'lx' }), '미신청 = 신청하지 않은 날 참여'),
        h('span', null, '📌 = 지정석'),
        h('span', null, h('i', { class: 'lh' }), '점선 = 지정석을 맡아 두었고 아직 앉지 않음'),
        h('span', null, '📝 = 메모 있음'),
        h('span', { id: 'supNames' }))),
    h('div', { class: 'card' }, h('h3', { style: 'margin-top:0' }, '🙋 신청하지 않고 참여한 학생 ', h('span', { id: 'extraCnt', class: 'tag xtag' }, '0')),
        h('p', { class: 'note' }, '이날 신청하지 않은 요일이거나 야자를 신청하지 않은 학생이 「학부모 동의」 를 체크하고 자리를 고르면 여기에 나오고, ' +
          '배치도의 자리에는 「미신청」 표시가 붙습니다. 신청한 학생이 ' + BOOT_DATA.from + '부터 먼저 고르고, 신청하지 않은 학생은 ' +
          BOOT_DATA.fromExtra + '부터 고릅니다. 1 · 2교시 모두 참여합니다.'),
        h('div', { id: 'extraList' })),
    h('div', { class: 'card' }, h('h3', { style: 'margin-top:0' }, '🚪 신청했지만 자리를 안 고른 학생 ', h('span', { id: 'missCnt', class: 'tag bad' }, '0')),
        h('p', { class: 'note' }, '결석이면 [결석], 병원·행사 등으로 빠지면 [자세히] 에서 「사유」 와 메모를 남기세요.'),
        h('p', { class: 'note pre' }, '📌 ', h('b', null, '담임 선생님은 결석 사유를 미리 적어 둘 수 있습니다.'),
          ' 위 날짜 칸에서 빠지는 날을 고르면 그날 신청한 학생이 여기 나옵니다. [자세히] → 「1·2교시 사유」 와 메모(예: 병원 · 체험학습)를 저장하세요. ' +
          '미리 적어도 그날 감독 교사로 이름이 남지 않습니다.'),
        h('div', { id: 'missList' }))
  ]);
  zoomBar($('mapbox'));
  renderControls();
}

function renderControls() {
  fill($('periods'), [1, 2].map(function (p) {
    return h('button', { class: 'btn' + (T.period === p ? ' on' : ''), type: 'button', onclick: function () { T.period = p; renderControls(); renderMap(); } }, p + '교시');
  }));
  fill($('modes'), MODES.map(function (m) {
    return h('button', { class: 'btn mode ' + (m.cls || '') + (T.mode === m.key ? ' on' : ''), type: 'button',
      onclick: function () { T.mode = m.key; renderControls(); } }, m.label);
  }));
  $('hint').textContent = T.mode === 'detail'
    ? T.period + '교시 · 좌석을 누르면 출결 · 메모 · PIN 초기화 창이 열립니다.'
    : T.period + '교시 · 좌석을 누르면 「' + T.mode + '」 표시를 하고, 다시 누르면 풉니다.';
}

function loadBoard(quiet) {
  if (!T.token) return Promise.resolve();
  return tCall('apiTBoard', [T.date, quiet ? T.ver : ''], { quiet: quiet }).then(function (r) {
    if (!r.ok) { if (!quiet && r.msg) toast(r.msg, 4000); return; }
    if (!(r.same && T.board)) T.board = r;
    T.ver = r.ver;
    if ($('updated')) $('updated').textContent = nowText();
    var fp = $('freePill');
    if (fp) {
      fp.textContent = r.free ? '⏱ 시간 제한 해제 중 — ' + r.free + '까지 (시트 메뉴에서 다시 켜기)' : '';
      fp.classList.toggle('hidden', !r.free);
    }
    if (T.tab === 'sup') { renderMap(); renderMiss(); renderFind(); }
  });
}

function bySeat() {
  var m = {};
  (T.board ? T.board.list : []).forEach(function (s) { if (s.seat) m[s.seat] = s; });
  return m;
}
function matches(s) {
  var q = T.search;
  if (!q) return false;
  return s.name.indexOf(q) >= 0 || s.sid.indexOf(q) >= 0;
}
function pOf(s) { return s['p' + T.period] || ''; }
/** 이날 참여했는가 (자리를 골랐거나 「출석」 표시). 맡아 두기만 한 지정석(held)은 아직 참여가 아니다 */
function attended(s) { return !!((s.seat && !s.held) || s.p1 === '출석' || s.p2 === '출석'); }
/** 이날 신청하지 않고 참여한 학생인가 */
function isExtra(s) { return !!s.ex && attended(s); }
function dayText(d) { return BOOT_DATA.days.filter(function (x, i) { return d[i]; }).join('·'); }

function renderMap() {
  if (!$('mapbox')) return;
  var b = T.board;
  var seats = bySeat();
  var taken = Object.keys(seats).length;
  $('cTaken').textContent = taken;
  $('cFree').textContent = BOOT_DATA.seatMax - taken;
  /* 출석 = 「출석」 표시 + 자리를 골랐고 아무 표시가 없는 학생 */
  var cnt = { '출석': 0, '결석': 0, '사유': 0 };
  var extra = 0;
  (b ? b.list : []).forEach(function (s) {
    var p = pOf(s) || (s.seat && !s.held ? '출석' : '');
    if (cnt[p] !== undefined) cnt[p]++;
    if (isExtra(s)) extra++;
  });
  fill($('counts'), Object.keys(cnt).map(function (k) {
    return h('span', null, k + ' ', h('b', { style: 'color:' + ({ '출석': '#15803d', '결석': '#374151', '사유': '#0f766e' })[k] }, cnt[k]));
  }).concat([h('span', null, '(미신청 참여 ', h('b', { style: 'color:#7c3aed' }, extra), ')')]));
  $('supNames').textContent = b ? dateLabel(b.date) + '(' + b.dayName + ') 감독 교사: ' + (b.sups && b.sups.length ? b.sups.join(', ') : '아직 없음') : '';
  drawMap($('mapbox'), function (no) {
    var s = seats[no];
    if (!s) return { cls: 'empty', title: no + '번 · 빈자리' };
    var p = pOf(s);
    var key = STATUS_KEY[p] || '';
    var ex = isExtra(s);
    var fixed = !!s.fx && s.fx === no;
    /* 지정석을 맡아 두었고 아직 앉았다고 알리지 않았으며 출결 표시도 없음 — 점선으로 흐리게 */
    var wait = !!s.held && !s.p1 && !s.p2;
    var kids = [
      h('span', { class: 'gb' }, s.g),
      s.memo ? h('span', { class: 'memo-dot' }, '📝') : null,
      ex ? h('span', { class: 'xb' }, '미신청') : null,
      h('span', { class: 'no corner' }, fixed ? h('span', { class: 'pin' }, '📌') : null, no),
      nameSpan(s.name),
      h('span', { class: 'sb' }, s.sid)
    ];
    /* 맡아 두기만 한 지정석은 점선 + 흐린 글자로 가른다 (낮은 좌석에 셋째 줄을 넣으면 이름이 밀려 가린다) */
    if (p && p !== '출석') kids.push(h('span', { class: 'stl st-' + key }, p));
    return {
      cls: 'taken clickable g' + s.g + (key ? ' st-' + key : '') + (ex ? ' ex' : '') + (wait ? ' held' : '') + (matches(s) ? ' hit' : ''),
      title: no + '번 · ' + s.sid + ' ' + s.name + ' (' + s.g + '학년 ' + s.c + '반 ' + s.n + '번)' +
        (fixed ? '\n📌 지정석' + (s.held ? ' — 아직 앉았다고 알리지 않음' : '') : '') +
        (ex ? '\n🙋 신청하지 않은 날 참여 · 학부모 동의 ' + (s.pc ? '체크 ' + s.pc.slice(11, 16) : '체크 없음') : '') +
        (s.held ? '\n1교시: ' + (s.p1 || '-') + ' · 2교시: ' + (s.p2 || '-') : '\n1교시: ' + (s.p1 || '출석') + ' · 2교시: ' + (s.p2 || '출석')) +
        (s.memo ? '\n메모: ' + s.memo : ''),
      kids: kids,
      onclick: function () { seatClick(s); }
    };
  });
}

function seatClick(s) {
  if (T.mode === 'detail') { openDetail(s); return; }
  var cur = pOf(s);
  var next = cur === T.mode ? '' : T.mode;
  var patch = {};
  patch['p' + T.period] = next;
  applyPatch(s, patch, s.name + ' ' + T.period + '교시 → ' + (next || '표시 없음(출석)'));
}

/** 화면을 먼저 바꾸고 서버에 보낸다. 실패하면 서버 값으로 다시 그린다 */
function applyPatch(s, patch, okMsg) {
  var undo = {};
  Object.keys(patch).forEach(function (k) {
    if (k === 'clearSeat') { undo.seat = s.seat; s.seat = 0; } else { undo[k] = s[k]; s[k] = patch[k]; }
  });
  renderMap(); renderMiss();
  return tCall('apiTUpdate', [T.date, s.id, patch]).then(function (r) {
    if (!r.ok) {
      Object.keys(undo).forEach(function (k) { s[k] = undo[k]; });
      renderMap(); renderMiss();
      if (r.msg) modal('저장하지 못했습니다', h('p', null, r.msg));
      return r;
    }
    if (okMsg) toast(okMsg);
    T.ver = '';
    return r;
  });
}

function statusRow(label, s, key) {
  var row = h('div', { class: 'row' }, h('b', null, label));
  function draw() {
    fill(row, [h('b', null, label)].concat(BOOT_DATA.statuses.map(function (st) {
      return h('button', { class: 'btn small' + (s._draft[key] === st ? ' on' : ''), type: 'button',
        onclick: function () { s._draft[key] = s._draft[key] === st ? '' : st; draw(); } }, st);
    })).concat([h('span', { class: 'note' }, s._draft[key] ? '' : (s.seat && !s.held ? '(표시 없음 = 출석으로 봄)' : '(표시 없음)'))]));
  }
  draw();
  return row;
}

function openDetail(s) {
  s._draft = { p1: s.p1 || '', p2: s.p2 || '' };
  var memo = h('textarea', { rows: '3', maxlength: String(BOOT_DATA.memoMax), placeholder: '예: 출석 표시했으나 자리에 없음 / 병원(사전 연락)' });
  memo.value = s.memo || '';
  var counter = h('div', { class: 'counter' });
  function cnt() { counter.textContent = memo.value.length + ' / ' + BOOT_DATA.memoMax + '자'; }
  memo.addEventListener('input', cnt); cnt();
  var both = h('div', { class: 'row' }, h('b', null, '함께'),
    BOOT_DATA.statuses.map(function (st) {
      return h('button', { class: 'btn small', type: 'button', onclick: function () { s._draft.p1 = st; s._draft.p2 = st; redraw(); } }, '1·2교시 ' + st);
    }));
  var rowsBox = h('div');
  function redraw() { fill(rowsBox, [statusRow('1교시', s, 'p1'), statusRow('2교시', s, 'p2')]); }
  redraw();
  var dayIdx = BOOT_DATA.days.indexOf(T.board ? T.board.dayName : '');
  var notApplied = s.ex || (dayIdx >= 0 && !s.d[dayIdx]);
  var body = h('div', null,
    h('p', { class: 'note', style: 'margin-top:0' },
      s.g + '학년 ' + s.c + '반 ' + s.n + '번 · 신청 요일 ' + (dayText(s.d) || '없음 (야자 미신청 학생)') +
      (s.held ? ' · 📌 지정석 ' + s.seat + '번을 맡아 둠 (아직 앉았다고 알리지 않음)'

/** 한 칸에 무엇을 적을까 — 출석부 종이에 「1」(신청) · 「○」(출석) 을 적던 방식을 그대로 따른다 */
function rollCell(w, s, i, k) {
  var date = w.dates[i];
  var rec = w.recs[date][s.id];
  var applied = s.d[i];
  var st = rec ? rec['p' + k] : '';
  var past = date < w.today || (date === w.today && w.hm > BOOT_DATA.to);
  var c = { text: '', cls: '' };
  if (st) { c.text = STATUS_MARK[st]; c.cls = { '출석': 'o', '결석': 'x', '사유': 's' }[st]; }
  else if (rec && rec.seat) { c.text = '○'; c.cls = 'o'; }
  else if (applied) { if (past) { c.text = '미'; c.cls = 'miss'; } else { c.text = '1'; c.cls = 'ap'; } }
  /* 신청하지 않은 날 참여한 칸은 ◎ (학부모 동의를 체크하고 자리를 고름) */
  if (c.text === '○' && rec && rec.ex) {
    c.text = '◎'; c.cls = 'ex';
    c.title = '신청하지 않은 날 참여 · 학부모 동의 ' + (rec.pc ? '체크 ' + rec.pc.slice(11, 16) : '체크 없음');
  }
  if (date === w.today) c.cls += ' today';
  if (rec && rec.memo) { c.cls += ' has-memo'; c.title = (c.title ? c.title + '\n' : '') + rec.memo; }
  return c;
}

    DAYN.map(function (d) { return h('th', { colspan: '2' }, d); }));
  var head2 = h('tr', null, w.dates.map(function (d) { return h('th', { colspan: '2' }, dateLabel(d)); }));

  var head4 = h('tr', null, w.dates.map(function () { return [h('th', null, '1교시'), h('th', null, '2교시')]; }));
  var body = w.students.map(function (s, idx) {

  fill($('rollBox'), [
    h('div', { class: 'print-title' }, schoolTerm(w.dates[0]) + ' ' + w.grade + '학년 야간 자율학습 출석부'),

      schoolTerm(w.dates[0]) + ' ' + w.grade + '학년 야간 자율학습 출석부 (' + dateLabel(w.dates[0]) + ' ~ ' + dateLabel(w.dates[3]) + ')'),
    h('div', { style: 'overflow-x:auto' }, h('table', { class: 'roll' }, h('thead', null, head1, head2, head3, head4), h('tbody', null, body)))
  ]);
  /* 날마다 요약 · 결석자 · 메모 */
  var sums = w.dates.map(function (d, i) {
    var applied = 0, ok = 0, absent = [], memos = [], extras = [];
    w.students.forEach(function (s) {
      var rec = w.recs[d][s.id];
      if (s.d[i]) applied++;
      var a = rollCell(w, s, i, 1), b = rollCell(w, s, i, 2);

      h('b', null, dateLabel(d) + '(' + DAYN[i] + ')'), ' 신청 ' + applied + '명 · 1·2교시 모두 출석 ' + ok + '명' +
        (extras.length ? ' · 미신청 참여 ' + extras.length + '명' : ''),
      extras.length ? h('div', null, h('span', { class: 'tag xtag' }, '🙋 미신청 참여'), ' ', extras.join(', ')) : null,

      memos.length ? h('div', { class: 'note' }, '📝 ' + memos.join(' / ')) : null);
  });

}

/* ═════════ 🧑‍🏫 담임교사 ═════════ */
function classOptions() {

}

    var want = sel.value;
    sel.value = T.cls;
    confirmLeave(function () { T.cls = want; sel.value = want; store('sc12-cls', want); renderClass(); loadClassLog(); });
  } }, classOptions().map(function (o) { return h('option', { value: o.v }, o.label); }));
  sel.value = T.cls;
  var ta = h('textarea', { rows: '6', maxlength: '6000', placeholder: '출석부 표를 그대로 복사해 붙여 넣거나, 한 줄에 한 명씩 「번호 이름 요일」 로 적으세요.\n예)  12 박수연 화 목\n     14 성규범 월 화 목 금' });
  fill($('pane'), [
    h('div', { class: 'card' },

        h('button', { class: 'btn', type: 'button', onclick: function () { loadRoster(); } }, '↻ 새로 불러오기')),
      h('div', { class: 'msg info', style: 'margin-top:10px' },
        h('div', null, '야자를 신청하는 학생은 월 · 화 · 목 · 금 가운데 이틀 이상 골라야 합니다.'),
        h('div', null, '참여하는 날은 1 · 2교시 모두 참여합니다.'),
        h('div', null, '학부모 동의가 확인된 학생만 추가해주세요.'))),
    h('div', { class: 'card', id: 'classBox' }, h('p', { class: 'note' }, '명단을 불러오는 중…')),
    h('div', { class: 'card', id: 'classLog' }),
    h('details', { class: 'card' },
      h('summary', { style: 'cursor:pointer;font-weight:700' }, '📋 여러 명 한꺼번에 붙여넣기'),
      h('p', { class: 'note' }, '출석부(한글) 표의 줄을 그대로 복사해도 됩니다 — 「연번 반 번호 성명」 뒤의 1 표시로 신청 요일을 읽습니다. 다른 반 줄은 넣지 않습니다.'),
      ta,
      h('div', { class: 'toolbar', style: 'justify-content:flex-start;margin-top:8px' },
        h('button', { class: 'btn', type: 'button', onclick: function () { bulk(ta, false); } }, '미리보기'),
        h('button', { class: 'btn primary', type: 'button', onclick: function () { bulk(ta, true); } }, '이대로 넣기')),
      h('div', { id: 'bulkBox' }))
  ]);
  renderClass();
  loadClassLog();
}

function curClass() { var p = T.cls.split('-'); return { g: Number(p[0]), c: Number(p[1]) }; }

function renderClass() {
  var box = $('classBox');
  if (!box) return;
  if (!T.roster) { fill(box, h('p', { class: 'note' }, '명단을 불러오는 중…')); return; }
  var cc = curClass();
  var list = T.roster.filter(function (s) { return s.g === cc.g && s.c === cc.c; }).sort(function (a, b) { return a.n - b.n; });
  /* 요일이 하나도 없는 학생 = 야자를 신청하지 않았지만 학부모 동의를 체크하고 참여하려고 스스로 등록한 학생 */
  var applied = list.filter(function (s) { return dayText(s.d); });
  var selfReg = list.filter(function (s) { return !dayText(s.d); });
  var rows = applied.map(function (s) { return classRow(s, cc); });
  rows.push(classRow(null, cc));
  function table(trs) {
    return h('div', { style: 'overflow-x:auto' }, h('table', { class: 'list' },
      h('thead', null, h('tr', null, h('th', { style: 'width:80px' }, '번호'), h('th', { style: 'width:130px' }, '이름'),
        BOOT_DATA.days.map(function (d) { return h('th', { style: 'width:46px' }, d); }),
        h('th', null, '학번'), h('th', null, 'PIN'), h('th', null, ''))),
      h('tbody', null, trs)));
  }
  fill(box, [
    h('h3', { style: 'margin-top:0' }, cc.g + '학년 ' + cc.c + '반 야자 신청 명단 ', h('span', { class: 'tag' }, applied.length + '명')),
    table(rows),
    selfReg.length ? h('div', { class: 'selfreg' },
      h('h3', null, '🙋 신청하지 않고 참여한 학생 ', h('span', { class: 'tag xtag' }, selfReg.length + '명')),
      h('p', { class: 'note' }, '야자를 신청하지 않았지만, 학부모 동의를 체크하고 그날만 참여하려고 학생이 스스로 등록한 경우입니다. ' +
        '야자를 신청하게 되면 학부모 동의를 확인한 뒤 요일을 이틀 이상 골라 [저장] 하세요 — 위 신청 명단으로 옮겨 갑니다. ' +
        '학번 · 이름을 잘못 적어 등록한 학생이면 이름을 바로잡거나(PIN 이 지워져 새로 정합니다) [삭제] 하세요.'),
      table(selfReg.map(function (s) { return classRow(s, cc); }))) : null
  ]);
}

function classRow(s, cc) {
  /* 고친 값은 T.drafts 에 둔다 — 다른 줄을 저장해 표를 새로 그려도 고치던 값이 사라지지 않게 */
  var key = s ? s.id : 'new:' + cc.g + '-' + cc.c;
  var orig = s ? { n: String(s.n), name: s.name, d: s.d.slice() } : { n: '', name: '', d: BOOT_DATA.days.map(function () { return false; }) };
  var cur = T.drafts[key] || orig;
  var num = h('input', { type: 'number', min: '1', max: String(BOOT_DATA.numMax), value: cur.n });
  var nm = h('input', { type: 'text', maxlength: '5', value: cur.name, placeholder: s ? '' : '새 학생 이름' });
  var days = BOOT_DATA.days.map(function (d, i) { return h('input', { type: 'checkbox', checked: cur.d[i], 'aria-label': d + '요일' }); });
  var sidCell = h('td', null, s ? s.sid : '-');
  var tr;
  function upd() {
    var n = Number(num.value);
    sidCell.textContent = n >= 1 && n <= BOOT_DATA.numMax ? String(cc.g) + (cc.c < 10 ? '0' : '') + cc.c + (n < 10 ? '0' : '') + n : '-';
  }
  /* 처음 값과 다르면 「저장 안 됨」 으로 표시하고 T.drafts 에 담는다. 처음 값으로 되돌리면 지운다 */
  function sync() {
    var now = { n: num.value.trim(), name: nm.value.trim(), d: days.map(function (x) { return x.checked; }) };
    var same = now.n === orig.n && now.name === orig.name && now.d.join() === orig.d.join();
    if (same) delete T.drafts[key];
    else {
      now.label = cc.g + '학년 ' + cc.c + '반 ' + (s ? s.n + '번 ' + s.name : '새 학생 줄' + (now.name ? '(' + now.name + ')' : ''));
      T.drafts[key] = now;
    }
    if (tr) tr.classList.toggle('dirty', !same);
    upd();
  }
  num.addEventListener('input', sync);
  nm.addEventListener('input', sync);
  days.forEach(function (x) { x.addEventListener('change', sync); });
  function save(btn) {
    var d = days.map(function (x) { return x.checked; });
    var n = Number(num.value), name = nm.value.trim();
    if (!(n >= 1 && n <= BOOT_DATA.numMax)) { toast('번호를 1~' + BOOT_DATA.numMax + ' 로 적어 주세요.'); return; }
    if (!/^[가-힣]{2,5}$/.test(name)) { toast('이름은 한글 2~5자로 적어 주세요.'); return; }
    if (d.filter(Boolean).length < BOOT_DATA.minDays) { toast('신청 요일을 이틀 이상 골라 주세요.', 3500); return; }
    btn.disabled = true;
    tCall('apiTSaveStudent', [{ id: s ? s.id : '', g: cc.g, c: cc.c, n: n, name: name, d: d }]).then(function (r) {
      btn.disabled = false;
      if (!r.ok) { if (r.msg) modal('저장하지 못했습니다', h('p', null, r.msg)); return; }
      toast((s ? '고쳤습니다: ' : '넣었습니다: ') + r.sid + ' ' + name +
        (r.pinCleared ? ' — 이름이 바뀌어 PIN 을 지웠습니다. 학생이 다음에 새로 정합니다.' : ''), r.pinCleared ? 4500 : 2600);
      delete T.drafts[key];
      T.ver = '';
      loadRoster();
    });
  }
  var actions = s
    ? [h('button', { class: 'btn small primary', type: 'button', onclick: function (e) { save(e.currentTarget); } }, '저장'), ' ',
       h('button', { class: 'btn small danger', type: 'button', onclick: function () { delStudent(s); } }, '삭제')]
    : [h('button', { class: 'btn small primary', type: 'button', onclick: function (e) { save(e.currentTarget); } }, '＋ 추가')];
  actions.push(h('div', { class: 'unsaved' }, '● 저장 안 됨'));
  tr = h('tr', { class: s ? null : 'newrow' },
    h('td', null, num),
    h('td', null, nm, s && s.fx ? h('span', { class: 'tag fxtag', title: '지정석 — 「📌 지정석」 탭에서 바꿉니다' }, '📌' + s.fx) : null),
    days.map(function (x) { return h('td', null, x); }),
    sidCell,
    h('td', null, s ? [h('span', { class: 'tag ' + (s.pin ? 'ok' : 'warn') }, s.pin ? '정함' : '아직'), ' ',
      s.pin ? h('button', { class: 'btn small danger', type: 'button', onclick: function () { resetPin(s); } }, '초기화') : null] : '-'),
    h('td', null, actions));
  if (T.drafts[key]) sync();
  return tr;
}

/** 저장하지 않은 줄의 이름표 목록 */
function classDirty() {
  return Object.keys(T.drafts).map(function (k) { return T.drafts[k].label; });
}

/** 저장하지 않은 줄이 있으면 「저장하지 않고 이동할까요?」 를 묻고, 이동하기로 하면 then() — 없으면 바로 then() */
function confirmLeave(then) {
  var list = classDirty();
  if (!list.length) { then(); return; }
  modal('저장하지 않은 변경이 있습니다', h('div', null,
    h('p', { style: 'margin-top:0' }, '담임교사 탭에서 고친 내용(신청 요일 · 번호 · 이름)을 아직 저장하지 않았습니다.'),
    h('ul', { class: 'dirtylist' }, list.slice(0, 8).map(function (l) { return h('li', null, l); })),
    list.length > 8 ? h('p', { class: 'note' }, '그 밖에 ' + (list.length - 8) + '줄 더') : null,
    h('p', null, h('b', null, '저장하지 않고 이동할까요?'), ' 이동하면 고친 내용은 사라집니다.')), [
    { label: '저장하지 않고 이동', cls: 'danger', onclick: function () { T.drafts = {}; then(); } },
    { label: '돌아가서 저장하기', cls: 'primary' }
  ]);
}

/* 창을 닫거나 새로 고칠 때도 — 브라우저가 「사이트에서 나가시겠습니까?」 를 묻는다 */
window.addEventListener('beforeunload', function (e) {
  if (T.token && classDirty().length) { e.preventDefault(); e.returnValue = ''; }
});

/* ── 📅 우리 반 출석 기록 (한 달) — 신청한 학생 · 신청하지 않고 참여한 학생 · 명단에서 빠진 학생 모두 ── */
function dayOf(date) {
  var p = date.split('-');
  return '일월화수목금토'.charAt(new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay());
}
function shiftYm(ym, n) {
  var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) - 1 + n;
  y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  return y + '-' + (m < 9 ? '0' : '') + (m + 1);
}

function loadClassLog() {
  var box = $('classLog');
  if (!box) return;
  var cc = curClass();
  if (!T.logYm) T.logYm = (T.date || todayLocal()).slice(0, 7);
  var key = T.cls + '|' + T.logYm;
  fill(box, [logHead(cc), h('p', { class: 'note' }, '불러오는 중…')]);
  tCall('apiTClassLog', [cc.g, cc.c, T.logYm]).then(function (r) {
    /* 기다리는 사이 반 · 달 · 탭을 바꿨으면 늦게 온 답은 버린다 */
    var now = $('classLog');
    if (!now || T.tab !== 'class' || key !== T.cls + '|' + T.logYm) return;
    if (!r.ok) { fill(now, [logHead(cc), h('div', { class: 'msg' }, r.msg || '불러오지 못했습니다.')]); return; }
    fill(now, [logHead(cc), logTable(r)]);
  });
}

function logHead(cc) {
  function go(n) { T.logYm = n ? shiftYm(T.logYm, n) : T.logYm; loadClassLog(); }
  return [
    h('div', { class: 'loghead' },
      h('h3', null, '📅 ' + cc.g + '학년 ' + cc.c + '반 출석 기록'),
      h('span', { class: 'seg' },
        h('button', { class: 'btn small', type: 'button', onclick: function () { go(-1); } }, '◀ 이전 달'),
        h('b', { class: 'ym' }, Number(T.logYm.slice(0, 4)) + '년 ' + Number(T.logYm.slice(5, 7)) + '월'),
        h('button', { class: 'btn small', type: 'button', onclick: function () { go(1); } }, '다음 달 ▶'),
        h('button', { class: 'btn small', type: 'button', onclick: function () { go(0); } }, '↻'))),
    h('p', { class: 'note', style: 'margin:4px 0' }, '야자를 신청한 학생과 신청하지 않고 참여한 학생을 모두 보여 줍니다. 칸을 누르면 그날 자리 · 출결 · 메모가 보입니다.'),
    h('div', { class: 'legend', style: 'justify-content:flex-start;margin:0 0 8px' },
      h('span', null, '○ 출석'), h('span', null, '◎ 신청하지 않은 날 참여(학부모 동의)'), h('span', null, '✕ 결석 · 사 사유'),
      h('span', null, '미 = 신청했는데 기록 없음'), h('span', null, '1 = 신청(아직 시작 전)'),
      h('span', null, '1·2교시가 다르면 두 표시 (예: ○✕)'))
  ];
}

/** 하루 칸 — 1·2교시를 한 칸에. k: 집계용 갈래 */
function logMark(rec, applied, date, r) {
  var past = date < r.today || (date === r.today && r.hm > BOOT_DATA.to);
  function pm(k) {
    var st = rec['p' + k];
    if (st === '결석') return 'x';
    if (st === '사유') return 's';
    if (st === '출석' || rec.seat) return 'o';
    return '';
  }
  var a = rec ? pm(1) : '', b = rec ? pm(2) : '';
  if (!a && !b) {
    if (applied) return past ? { t: '미', cls: 'miss', k: { miss: 1 } } : { t: '1', cls: 'ap', k: {} };
    return { t: '', cls: '', k: {} };
  }
  var sym = { o: rec.ex ? '◎' : '○', x: '✕', s: '사', '': '·' };
  var one = { o: rec.ex ? 'ex' : 'o', x: 'x', s: 's' };
  var k = {};
  if (a === 'o' || b === 'o') k[rec.ex ? 'ex' : 'o'] = 1;
  if (a === 'x' || b === 'x') k.x = 1;
  if (a === 's' || b === 's') k.s = 1;
  return { t: a === b ? sym[a] : sym[a] + sym[b], cls: a === b ? one[a] : 'mix', k: k };
}

function logTable(r) {
  if (!r.students.length) return h('p', { class: 'note' }, '이 반에는 아직 학생이 없습니다.');
  var head = h('tr', null, h('th', { class: 'nm' }, '번호 · 이름'), h('th', null, '신청 요일'),
    r.dates.map(function (d) {
      return h('th', { class: (dayOf(d) === '월' ? 'wk ' : '') + (d === r.today ? 'today' : '') }, Number(d.slice(8)), h('div', { class: 'wd' }, dayOf(d)));
    }),
    h('th', { class: 'sum' }, '출석'), h('th', { class: 'sum' }, '미신청 참여'), h('th', { class: 'sum' }, '결석'),
    h('th', { class: 'sum' }, '사유'), h('th', { class: 'sum' }, '미입실'));
  var body = r.students.map(function (s) {
    var tot = { o: 0, ex: 0, x: 0, s: 0, miss: 0 };
    var cells = r.dates.map(function (d) {
      var rec = (r.recs[s.id] || {})[d] || null;
      var applied = !s.gone && !!s.d[BOOT_DATA.days.indexOf(dayOf(d))];
      var m = logMark(rec, applied, d, r);
      Object.keys(m.k).forEach(function (x) { tot[x]++; });
      var cls = (m.cls || '') + (dayOf(d) === '월' ? ' wk' : '') + (d === r.today ? ' today' : '') + (rec && rec.memo ? ' has-memo' : '') +
        (rec || applied ? ' tap' : '');
      return h('td', { class: cls, title: rec && rec.memo ? rec.memo : null,
        onclick: rec || applied ? function () { logDetail(s, d, rec, applied); } : null }, m.t);
    });
    return h('tr', null,
      h('td', { class: 'nm' }, h('span', { class: 'nn' }, s.n), ' ', s.name,
        s.gone ? h('span', { class: 'tag' }, '명단에서 빠짐') : (dayText(s.d) ? null : h('span', { class: 'tag xtag' }, '미신청'))),
      h('td', { class: 'dd' }, dayText(s.d) || '-'),
      cells,
      h('td', { class: 'sum' }, tot.o), h('td', { class: 'sum ex' }, tot.ex || ''), h('td', { class: 'sum' }, tot.x || ''),
      h('td', { class: 'sum' }, tot.s || ''), h('td', { class: 'sum' }, tot.miss || ''));
  });
  return h('div', { class: 'logwrap' }, h('table', { class: 'roll clog' }, h('thead', null, head), h('tbody', null, body)));
}

function logDetail(s, date, rec, applied) {
  function row(k, v) { return h('tr', null, h('th', null, k), h('td', { class: 'l' }, v)); }
  var ex = rec ? rec.ex : !applied;
  modal(dateLabel(date) + '(' + dayOf(date) + ') · ' + s.n + '번 ' + s.name, h('div', null,
    h('p', { class: 'note', style: 'margin-top:0' }, ex ? '🙋 신청하지 않은 날' : '야자를 신청한 날'),
    rec ? h('table', { class: 'list' }, h('tbody', null,
      row('자리', rec.seat ? rec.seat + '번' : '고르지 않음'),
      row('1교시', rec.p1 || (rec.seat ? '출석 (표시 없음)' : '-')),
      row('2교시', rec.p2 || (rec.seat ? '출석 (표시 없음)' : '-')),
      ex ? row('학부모 동의', rec.pc ? '학생이 체크함 (' + rec.pc.slice(11, 16) + ')' : '체크 없음 (교사가 기록)') : null,
      row('메모', rec.memo || '-')))
      : h('p', null, '이날 기록이 없습니다 (자리를 고르지 않았고 출결 표시도 없음).')));
}

function delStudent(s) {
  ask('명단에서 지우기', s.sid + ' ' + s.name + ' 학생을 야자 명단에서 지울까요? 지난 출결 기록은 시트 「기록」 에 그대로 남습니다.', '지우기').then(function (y) {
    if (!y) return;
    tCall('apiTDeleteStudent', [s.id]).then(function (r) {
      if (!r.ok) { if (r.msg) modal('지우지 못했습니다', h('p', null, r.msg)); return; }
      toast(s.name + ' 학생을 명단에서 지웠습니다.');
      delete T.drafts[s.id];
      T.ver = '';
      loadRoster();
    });
  });
}

function bulk(ta, apply) {
  var cc = curClass();
  if (!ta.value.trim()) { toast('붙여 넣을 내용이 없습니다.'); return; }
  var go = function () {
    tCall('apiTBulk', [cc.g, cc.c, ta.value, apply]).then(function (r) {
      if (!r.ok) { if (r.msg) fill($('bulkBox'), h('div', { class: 'msg' }, r.msg)); return; }
      if (apply) {
        fill($('bulkBox'), h('div', { class: 'msg ok' }, '넣었습니다 — 추가 ' + r.added + '명 · 고침 ' + r.updated + '명'));
        ta.value = '';
        T.ver = '';
        loadRoster();
        return;
      }
      fill($('bulkBox'), [
        h('p', null, '넣을 수 있는 줄 ', h('b', null, r.good), '개 / 전체 ' + r.rows.length + '줄. 오류가 있는 줄은 넣지 않습니다.'),
        h('table', { class: 'list' },
          h('thead', null, h('tr', null, h('th', null, '붙여 넣은 줄'), h('th', null, '번호'), h('th', null, '이름'), h('th', null, '요일'), h('th', null, '결과'))),
          h('tbody', null, r.rows.map(function (x) {
            return h('tr', null, h('td', { class: 'l note' }, x.text), h('td', null, x.n || '-'), h('td', null, x.name || '-'),
              h('td', null, BOOT_DATA.days.filter(function (d, i) { return x.d[i]; }).join('·') || '-'),
              h('td', null, x.err ? h('span', { class: 'tag bad' }, x.err) : h('span', { class: 'tag ok' }, x.action)));
          })))
      ]);
    });
  };
  if (apply) ask('붙여넣기', cc.g + '학년 ' + cc.c + '반 명단에 넣을까요? 이미 있는 번호는 이름 · 요일을 고칩니다.', '넣기').then(function (y) { if (y) go(); });
  else go();
}

/* ═════════ 📌 지정석 — 학생에게 고정 자리를 준다 ═════════
   지정석은 그 학생이 신청한 요일에만 맡아 둔다(서버 occupy_). 날짜와 상관없는 명단 정보라 T.roster 로 그린다. */
var FX_DRAW = null;

function fxBySeat() {
  var m = {};
  (T.roster || []).forEach(function (s) { if (s.fx) m[s.fx] = s; });
  return m;
}

function buildFixed() {
  fill($('pane'), [
    h('div', { class: 'card noprint' },
      h('div', { class: 'msg info', style: 'margin:0' },
        h('div', null, h('b', null, '📌 지정석'), ' — 배치도에서 자리를 누르면 학생을 찾아 지정하거나, 지정을 풀 수 있습니다.'),
        h('div', null, '그 학생이 신청한 요일에는 지정석을 맡아 두어 다른 학생이 앉을 수 없습니다 (그 학생이 오지 않은 날도). ' +
          '신청하지 않은 요일에는 다른 학생도 앉을 수 있습니다.'),
        h('div', null, '지정석 학생은 신청한 날 다른 자리를 고르지 않고, 와서 자기 자리를 눌러 「앉았어요」 를 알립니다. ' +
          '알리기 전에는 야자감독 배치도에 점선(아직 안 앉음)으로 보입니다.'),
        h('div', null, '야자를 신청한 학생(요일이 있는 학생)에게만 줄 수 있습니다.'))),
    h('div', { class: 'card' },
      h('div', { class: 'pillrow', style: 'margin-top:0' },
        h('span', { class: 'pill' }, '지정석 ', h('b', { id: 'fxCnt' }, '0'), ' 석'),
        h('button', { class: 'btn small', type: 'button', onclick: function () { loadRoster(); } }, '↻ 새로 불러오기')),
      h('div', { class: 'mapbox', id: 'fxmap' }),
      h('div', { class: 'legend' },
        h('span', null, h('i', { class: 'l1' }), '1학년'),
        h('span', null, h('i', { class: 'l2' }), '2학년'),
        h('span', null, '빈자리를 누르면 지정 · 지정석을 누르면 바꾸기 · 풀기'))),
    h('div', { class: 'card', id: 'fxList' })
  ]);
  zoomBar($('fxmap'));
  renderFixed();
}

function renderFixed() {
  var box = $('fxmap');
  if (!box) return;
  if (!T.roster) { fill(box, h('p', { class: 'note' }, '명단을 불러오는 중…')); return; }
  var m = fxBySeat();
  var all = Object.keys(m).map(Number).sort(function (a, b) { return a - b; });
  $('fxCnt').textContent = all.length;
  drawMap(box, function (no) {
    var s = m[no];
    if (!s) return { cls: 'empty clickable', title: no + '번 · 지정석 아님 — 눌러서 학생 지정', onclick: function () { openFixed(no); } };
    return {
      cls: 'taken clickable g' + s.g,
      title: no + '번 · 📌 ' + s.sid + ' ' + s.name + ' (신청 ' + (dayText(s.d) || '없음') + ')',
      kids: [h('span', { class: 'gb' }, s.g), h('span', { class: 'no corner' }, h('span', { class: 'pin' }, '📌'), no), nameSpan(s.name), h('span', { class: 'sb' }, s.sid)],
      onclick: function () { openFixed(no); }
    };
  });
  var list = $('fxList');
  if (!all.length) {
    fill(list, [h('h3', { style: 'margin-top:0' }, '📌 지정석 목록'), h('p', { class: 'note' }, '아직 지정석이 없습니다. 위 배치도에서 자리를 눌러 학생에게 지정하세요.')]);
    return;
  }
  fill(list, [
    h('h3', { style: 'margin-top:0' }, '📌 지정석 목록 ', h('span', { class: 'tag' }, all.length + '석')),
    h('div', { style: 'overflow-x:auto' }, h('table', { class: 'list' },
      h('thead', null, h('tr', null, h('th', null, '자리'), h('th', null, '학번'), h('th', null, '이름'), h('th', null, '신청 요일'), h('th', null, ''))),
      h('tbody', null, all.map(function (no) {
        var s = m[no];
        return h('tr', null,
          h('td', null, h('b', null, '📌 ' + no + '번')),
          h('td', null, h('span', { class: 'tag g' + s.g }, s.g + '학년'), ' ', s.sid),
          h('td', null, s.name),
          h('td', null, dayText(s.d) || h('span', { class: 'tag warn' }, '없음 — 맡아 두지 않음')),
          h('td', null, h('button', { class: 'btn small', type: 'button', onclick: function () { scrollToSeat($('fxmap'), no); openFixed(no); } }, '바꾸기 · 풀기')));
      }))))
  ]);
}

/** 자리 하나 — 지금 누구의 지정석인지 보여 주고, 학생을 찾아 지정 · 바꾸기 · 풀기 */
function openFixed(no) {
  if (!T.roster) loadRoster();
  var cur = fxBySeat()[no] || null;
  var q = h('input', { type: 'text', maxlength: '10', placeholder: '이름 또는 학번', autocomplete: 'off', class: 'pin-q' });
  var box = h('div', { class: 'pin-list' });
  /* 「바꿀까요?」 를 띄운 학생 아이디 (다른 학생의 지정석을 넘길 때) */
  var asking = '';
  function draw() {
    if (!box.isConnected) return;
    var s = q.value.trim();
    if (!T.roster) { fill(box, h('p', { class: 'note' }, '명단을 불러오는 중…')); return; }
    if (!s) { fill(box, h('p', { class: 'note' }, (cur ? '다른 학생으로 바꾸려면' : '이 자리를 줄 학생의') + ' 이름이나 학번을 적어 주세요.')); return; }
    var all = T.roster.filter(function (st) { return st.name.indexOf(s) >= 0 || st.sid.indexOf(s) >= 0; });
    if (!all.length) { fill(box, h('p', { class: 'note' }, '찾는 학생이 명단에 없습니다.')); return; }
    fill(box, [all.slice(0, FIND_MAX).map(function (st) {
      var act;
      if (st.fx === no) act = h('span', { class: 'tag ok' }, '지금 이 자리');
      else if (!dayText(st.d)) act = h('span', { class: 'tag warn' }, '신청 요일 없음');
      else if (asking === st.id) {
        act = h('span', { class: 'pin-ask' }, cur.name + ' 학생의 지정을 풀고 바꿀까요? ',
          h('button', { class: 'btn small primary', type: 'button', onclick: function () { give(st, true); } }, '바꾸기'),
          h('button', { class: 'btn small', type: 'button', onclick: function () { asking = ''; draw(); } }, '취소'));
      } else {
        act = h('button', { class: 'btn small primary', type: 'button', onclick: function () {
          if (cur) { asking = st.id; draw(); } else give(st, false);
        } }, '📌 ' + no + '번으로 지정');
      }
      return h('div', { class: 'pin-row' },
        h('span', { class: 'tag g' + st.g }, st.g + '학년'),
        h('span', { class: 'fp-sid' }, st.sid),
        h('b', null, st.name),
        h('span', { class: 'note' }, '신청 ' + (dayText(st.d) || '없음') + (st.fx && st.fx !== no ? ' · 지금 지정석 ' + st.fx + '번 (옮김)' : '')),
        act);
    }), all.length > FIND_MAX ? h('p', { class: 'note' }, '그 밖에 ' + (all.length - FIND_MAX) + '명 더 — 더 자세히 적어 주세요.') : null]);
  }
  function give(st, replace) {
    tCall('apiTSetFixed', [st.id, no, replace]).then(function (r) {
      if (!r.ok) { if (r.msg) toast(r.msg, 4500); if (r.taken) loadRoster(); return; }
      closeModal(); FX_DRAW = null;
      toast('📌 ' + no + '번을 ' + st.name + ' 학생의 지정석으로 정했습니다.' +
        (r.before ? ' (예전 지정석 ' + r.before + '번은 풀림)' : '') + (r.freed ? ' (' + r.freed + ' 학생의 지정은 풀림)' : ''), 4000);
      if (r.note) modal('오늘은 그대로 둡니다', h('p', null, r.note));
      T.ver = '';
      loadRoster();
    });
  }
  function release() {
    ask('지정석 풀기', no + '번 지정석을 풀까요? ' + cur.sid + ' ' + cur.name + ' 학생은 다음부터 다른 학생처럼 빈자리를 골라 앉습니다. ' +
      '(오늘 이미 앉았으면 오늘 자리는 그대로 남습니다)', '풀기').then(function (y) {
      if (!y) return;
      tCall('apiTSetFixed', [cur.id, 0]).then(function (r) {
        if (!r.ok) { if (r.msg) modal('풀지 못했습니다', h('p', null, r.msg)); return; }
        toast(no + '번 지정석을 풀었습니다.');
        T.ver = '';
        loadRoster();
      });
    });
  }
  q.addEventListener('input', function () { asking = ''; draw(); });
  FX_DRAW = draw;
  var buttons = [];
  if (cur) buttons.push({ label: '📌 지정 풀기', cls: 'danger', onclick: function () { release(); return false; } });
  buttons.push({ label: '닫기' });
  modal('📌 ' + no + '번 지정석', h('div', null,
    cur ? h('div', { class: 'whoami', style: 'margin-top:0' },
      h('div', { class: 'big' }, cur.g + '학년 ' + cur.c + '반 ' + cur.n + '번 · ' + cur.name + ' (' + cur.sid + ')'),
      h('p', { class: 'note' }, '신청 요일 ' + (dayText(cur.d) || '없음') + ' — 이 요일에는 이 자리를 맡아 둡니다.'))
      : h('p', { class: 'note', style: 'margin-top:0' }, '아직 아무에게도 주지 않은 자리입니다. 지정할 학생을 찾아 [📌 ' + no + '번으로 지정] 을 누르세요.'),
    q, box), buttons);
  draw();
}

/* ── 시작 ── */
if (T.token) start(); else tGate();
</script>
