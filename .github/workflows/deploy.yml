# 1·2학년 자습실 좌석배치도 — 깃허브 Pages 로 배포한다.
# © 2026 티쳐무 · 모든 권리 보유
# 서버(시트 · 로그인 · 자리)는 구글 앱스 스크립트에서 돈다. 여기서 올리는 것은 첫 화면(바로가기, site/index.html),
# 그 서버를 doPost 로 부르는 실제 앱 화면(app/ — 구글 계정이 여러 개인 폰에서도 열리게),
# 가짜 시트 위에서 도는 체험판(demo · student · teacher)이다.
name: Pages 배포 (바로가기 · 체험판)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 점검 (문법 · 앱스 스크립트 함정 · 저작권 · 비밀번호 원문)
        run: npm run check
      - name: 시험 (가짜 시트 위의 진짜 Code.gs)
        run: npm test
      - name: 바로가기 · 체험 페이지 만들기
        run: npm run site
      - name: 빌드 결과 점검
        run: |
          for f in index.html demo.html student.html teacher.html; do test -s "dist/site/$f" || { echo "없음: $f"; exit 1; }; done
          grep -q 'id="goStudent" href="app/"' dist/site/index.html
          grep -q 'id="rawStudent" href="https://script.google.com/macros/s/' dist/site/index.html
          grep -q '/exec?page=teacher"' dist/site/index.html
          for f in app/index.html app/teacher.html; do
            test -s "dist/site/$f" || { echo "없음: $f"; exit 1; }
            grep -q 'var REMOTE_URL = "https:' "dist/site/$f"
            grep -q "credentials: 'omit'" "dist/site/$f"
            if grep -q 'FAKEGAS' "dist/site/$f"; then echo "가짜 시트가 섞임: $f"; exit 1; fi
          done
          size=$(wc -c < dist/site/teacher.html)
          echo "teacher.html = $size bytes"
          test "$size" -gt 100000
          grep -q "티쳐무" dist/site/demo.html
          # 교내에서 함께 쓰는 화면(첫 화면 · 실제 앱 · 체험 앱)의 푸터에는 저작권 표시를 두지 않는다
          for f in index.html student.html teacher.html app/index.html app/teacher.html; do
            if sed -n '/<footer>/,/<\/footer>/p' "dist/site/$f" | grep -q "티쳐무"; then echo "화면 푸터에 저작권 표시: $f"; exit 1; fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
